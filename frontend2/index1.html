<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Stop Motion - Bundle Free</title>
    
    <!-- Mapbox GL CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #map {
            width: 100vw;
            height: 100vh;
        }
        
        .zoom-display {
            position: absolute;
            top: 20px;
            right: 60px;
            z-index: 10;
            background-color: black;
            color: #ccc;
            padding: 0.5rem;
            font-size: 20px;
            border-radius: 4px;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 1rem;
            border-radius: 8px;
            font-size: 18px;
        }
        
        body.loaded .loading {
            display: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="loading">Loading map...</div>
    <div id="zoom-display" class="zoom-display" style="display: none;">
        zoom: <span id="zoom-level">16.00</span>
    </div>

    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    
    <!-- ES6 Modules -->
    <script type="module" src="./config.js"></script>
    <script type="module" src="./visualization.js"></script>
    <script type="module" src="./buildmap.js"></script>
</body>
</html>
